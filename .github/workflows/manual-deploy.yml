name: Manual Deploy

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Determinar Branch ou Tag
        id: ref
        run: |
          REF="${{ github.ref }}"
          REF_NAME="${{ github.ref_name }}"

          if [[ "$REF" == refs/heads/* ]]; then
            echo "Branch detectada: $REF_NAME"
            echo "ref=$REF_NAME" >> $GITHUB_ENV
          elif [[ "$REF" == refs/tags/* ]]; then
            echo "Tag detectada: $REF_NAME"
            echo "ref=$REF_NAME" >> $GITHUB_ENV
          else
            echo "❌ ERRO: Não foi possível determinar se é uma branch ou tag!"
            exit 1
          fi

      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ref }}

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar QEMU (para compatibilidade multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gestion_transferencias_bancarias:${{ github.ref_name }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/gestion_transferencias_bancarias:${{ github.ref_name }}
          cache-to: type=inline
