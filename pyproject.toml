[project]
name = "gestion-transferencias-bancarias"
version = "2.0.0"
description = "API de gestion bancaria con FastAPI y PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "psycopg2-binary>=2.9.9",
    "pydantic==2.5.0",
    "email-validator>=2.1.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[argon2]==1.7.4",
    "python-multipart==0.0.6",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.2,<4.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "reportlab>=4.0.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "requests>=2.31.0",
]

[tool.uv]
package = false
